[workspace]
members = [
    "crates/fig-reader",
    "crates/conversion-report",
    "crates/penpot-writer",
    "crates/conversion-core",
    "crates/f2p-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danialshirali16/Figma2Penpot"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.29", features = ["v5", "serde"] }
zip = { version = "9.2", default-features = false, features = ["deflate-flate2"] }
