[package]
name = "desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Figma 2 Penpot native desktop application"

[lib]
name = "desktop_app"
path = "src/lib.rs"

[[bin]]
name = "figma2penpot"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
conversion-core = { path = "../conversion-core" }
conversion-report = { path = "../conversion-report" }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
fig-reader = { path = "../fig-reader" }
penpot-writer = { path = "../penpot-writer" }
rfd = { version = "0.16.1", default-features = false, features = ["gtk3"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
